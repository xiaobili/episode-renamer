services:
  episode-renamer:
    # 单镜像：前端静态产物 + Python 依赖 + 运行时环境全部在镜像内，
    # 这里只负责端口映射、媒体目录挂载和环境变量。
    image: episode-renamer:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 让容器内进程的 uid 与宿主机媒体目录属主一致，写 NFO / STRM 不会留下 root 文件
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: episode-renamer
    restart: unless-stopped
    # 使用 Docker 默认网桥（docker0），Compose 不再创建项目专属网络
    network_mode: bridge
    ports:
      - "${APP_PORT:-6969}:6969"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - DEBUG=false
      # 不设即「未配置」，TMDB 功能整体静默降级，不发任何网络请求
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - TMDB_LANGUAGE=${TMDB_LANGUAGE:-zh-CN}
    volumes:
      # 左侧换成你的媒体目录；右侧容器内路径默认 /media
      - ${MEDIA_DIR:-./media}:/media:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health' % os.environ.get('PORT', '6969'))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
