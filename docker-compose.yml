services:
  episode-renamer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: episode-renamer
    restart: unless-stopped
    # 使用 Docker 默认网桥（docker0），Compose 不再创建项目专属网络
    network_mode: bridge
    ports:
      - "6969:6969"
    environment:
      - TZ=Asia/Shanghai
      - UVICORN_WORKERS=1
    volumes:
      - /path/to/your/media:/media:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6969/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
